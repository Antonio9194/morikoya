  access:
    title: "교통 및 접근"
    description: "아사쿠사는 도쿄에서도 최고의 교통 편의성을 자랑하며, 호텔에서 시내 관광 명소로의 이동이 쉽습니다. 여러 철도 노선, 공항 연결, 관광 보트가 가까워 이동이 간편하고 편리합니다."

    subway:
      - station: "아사쿠사역 (츠쿠바 익스프레스 – TX선) – 도보 3분"
        info: "가장 가까운 역, 아키하바라 및 도쿄 북부로 편리한 접근"
      - station: "타와라마치역 (긴자선) – 도보 7분"
        info: "우에노, 긴자, 신바시, 아카사카, 시부야로 빠른 이동"
      - station: "아사쿠사역 (긴자선) – 도보 10분"
        info: "우에노, 긴자, 시부야로 직통 접근"

    airport:
      title: "공항 접근"
      haneda: "하네다 공항 → 아사쿠사: 약 40~45분 (토에이 아사쿠사선, 환승 없는 경우도 있음)"
      narita: "나리타 공항 → 아사쿠사: 약 60~70분 (게이세이선 → 토에이 아사쿠사선, 일부 직통 있음)"

    bus:
      title: "버스 및 노선 접근"
      info1: "토에이 버스로 우에노, 도쿄 스카이트리, 도쿄역, 니혼바시까지 직통 연결"
      info2: "지상 이동을 선호하는 고객에게 편리"

    sightseeing:
      title: "관광 옵션"
      info1: "도쿄 수상 버스 (스미다강 크루즈) – 도보 10분"
      info2: "오다이바, 하마리큐, 히노데 부두로의 경관 접근"
      info3: "아사쿠사 역사 거리에서는 인력거 투어 이용 가능"

    taxi:
      title: "택시 및 라이드셰어"
      info1: "카미나리몬 및 아사쿠사역 근처에 택시 승강장 있음"
      info2: "캐시리스 배차 앱 이용 가능: GO, Uber, DiDi"

  location:
    link:
      map: "지도"
      access: "오시는 길"
      form: "문의 양식"
    title: "위치 및 교통"
    question1: "호텔에는 어떻게 가나요?"
    answer1: >
      호텔은 아사쿠사역과 다와라마치역 인근에 위치해 있으며,
      지하철과 버스를 이용해 편리하게 오실 수 있습니다.
      정확한 주소는 %{map_link} 를 참고하시고,
      %{access_link} 섹션도 함께 확인해 주세요.
      추가 안내가 필요하시면 %{contact_link} 를 통해 문의해 주세요.
    question2: "공항 픽업 서비스가 있나요?"
    answer2: "공항 픽업 서비스는 제공하지 않지만, 최적의 이동 경로를 안내해 드립니다."
    question3: "근처에 주차장이 있나요?"
    answer3: "호텔 내 주차장은 없으나, 도보 거리 내에 여러 유료 주차장이 있습니다."    