  access:
    title: "교통 및 접근"
    description: "아사쿠사는 도쿄에서도 최고의 교통 편의성을 자랑하며, 호텔에서 시내 관광 명소로의 이동이 쉽습니다. 여러 철도 노선, 공항 연결, 관광 보트가 가까워 이동이 간편하고 편리합니다."

    subway:
      - station: "아사쿠사역 (츠쿠바 익스프레스 – TX선) – 도보 3분"
        info: "가장 가까운 역, 아키하바라 및 도쿄 북부로 편리한 접근"
      - station: "타와라마치역 (긴자선) – 도보 7분"
        info: "우에노, 긴자, 신바시, 아카사카, 시부야로 빠른 이동"
      - station: "아사쿠사역 (긴자선) – 도보 10분"
        info: "우에노, 긴자, 시부야로 직통 접근"

    airport:
      title: "공항 접근"
      haneda: "하네다 공항 → 아사쿠사: 약 40~45분 (토에이 아사쿠사선, 환승 없는 경우도 있음)"
      narita: "나리타 공항 → 아사쿠사: 약 60~70분 (게이세이선 → 토에이 아사쿠사선, 일부 직통 있음)"

    bus:
      title: "버스 및 노선 접근"
      info1: "토에이 버스로 우에노, 도쿄 스카이트리, 도쿄역, 니혼바시까지 직통 연결"
      info2: "지상 이동을 선호하는 고객에게 편리"

    sightseeing:
      title: "관광 옵션"
      info1: "도쿄 수상 버스 (스미다강 크루즈) – 도보 10분"
      info2: "오다이바, 하마리큐, 히노데 부두로의 경관 접근"
      info3: "아사쿠사 역사 거리에서는 인력거 투어 이용 가능"

    taxi:
      title: "택시 및 라이드셰어"
      info1: "카미나리몬 및 아사쿠사역 근처에 택시 승강장 있음"
      info2: "캐시리스 배차 앱 이용 가능: GO, Uber, DiDi"

  location:
    link:
      map: "지도"
      access: "오시는 길"
      form: "문의 양식"
    title: "위치 및 교통"
    question1: "호텔에는 어떻게 가나요?"
    answer1: >
      호텔은 아사쿠사역과 다와라마치역 인근에 위치해 있으며,
      지하철과 버스를 이용해 편리하게 오실 수 있습니다.
      정확한 주소는 %{map_link} 를 참고하시고,
      %{access_link} 섹션도 함께 확인해 주세요.
      추가 안내가 필요하시면 %{contact_link} 를 통해 문의해 주세요.
    question2: "공항 픽업 서비스가 있나요?"
    answer2: "공항 픽업 서비스는 제공하지 않지만, 최적의 이동 경로를 안내해 드립니다."
    question3: "근처에 주차장이 있나요?"
    answer3: "호텔 내 주차장은 없으나, 도보 거리 내에 여러 유료 주차장이 있습니다."

  arrivals:
    room: "객실"
    checkin: "체크인"
    guests: "인원"

  attractions:
    title: "주변 관광지"
    description: "호텔 인근에는 도쿄를 대표하는 문화·역사 명소들이 도보 거리 내에 위치해 있어 편리하게 둘러보실 수 있습니다."
    attraction1: "센소지 사원(浅草寺) – 도보 8분"
    info1: "도쿄에서 가장 오래되고 방문객이 많은 사원으로, 가미나리몬과 오층탑으로 유명합니다."
    attraction2: "나카미세 거리 – 도보 9분"
    info2: "센소지로 이어지는 전통 거리로, 공예품과 일본 길거리 간식을 즐길 수 있습니다."
    attraction3: "아사쿠사 신사(浅草神社) – 도보 10분"
    info3: "센소지 옆에 위치한 신사로, 산자 마쓰리 축제로 잘 알려져 있습니다."
    attraction4: "아사쿠사 문화 관광 안내소 – 도보 11분"
    info4: "아사쿠사와 도쿄 스카이트리를 한눈에 볼 수 있는 무료 전망대를 제공합니다."
    attraction5: "하나야시키 놀이공원 – 도보 12분"
    info5: "일본에서 가장 오래된 놀이공원으로, 레트로한 놀이기구와 가족 친화적인 시설이 특징입니다."
    attraction6: "스미다 공원 – 도보 13분"
    info6: "벚꽃 명소로 유명한 강변 공원으로, 스카이트리 전망을 즐길 수 있습니다."
    attraction7: "스미다강 산책로 – 도보 15분"
    info7: "강변 경치를 감상할 수 있는 보행자 전용 다리로, 도쿄 스카이트리로 이동하기에 편리합니다."
    attraction8: "도쿄 스카이트리 – 도보 20분 / 전철 10분"
    info8: "일본에서 가장 높은 타워로, 전망대·수족관·쇼핑 시설이 있습니다."

  culture:
    title: "문화 체험"
    culture1: "현대 및 빈티지 기모노/유카타 대여 (헤어 스타일링 선택 가능); 센소지 탐방에 적합."
    info1: "도쿄에서 가장 오래되고 가장 많이 방문하는 사원. 유명한 가미나리몬과 오층탑 포함."
    culture2: "케사 도쿄 기모노 렌탈 – 도보 10분"
    info2: "캐주얼 및 포멀 기모노 옵션 제공, 영어 지원 가능. 아사쿠사 신사 거리 산책에 최적."
    culture3: "다도 체험 – 도보 10분"
    info3: "다다미 방에서 전통 다도 예절을 배우고, 말차를 준비하며 일본 과자를 즐기기."
    culture4: "와가시 만들기 체험 – 도보 10분"
    info4: "전통 제과사 지도하에 계절별 네리키리 과자 만들기."
    culture5: "종이접기 / 서예 체험 – 도보 10분"
    info5: "직접 일본 서예 또는 전통 종이 공예를 체험."
    culture6: "기모노 + 에도 키리코 유리공예 체험 (하나카 × 소키치) – 도보 12분"
    info6: "기모노를 입고 에도식 컷 글라스를 만들어보는 독특한 공예&문화 체험."
    culture7: "스모 박물관 & 료고쿠 국기관 – 전철 20분"
    info7: "스모 문화의 중심지. 박물관, 경기장, 료고쿠의 스모 테마 거리 탐방."
    culture8: "스모 조조 연습 관람 – 전철 20분"
    info8: "이른 아침 스모 체육관 방문, 실제 스모 생활 체험."

  facilities:
    title: "시설"
    question1: "세탁 공간이 있나요?"
    answer1: "예, 모든 아파트에는 세탁기와 건조기가 있습니다."
    question2: "수하물 보관이 가능한가요?"
    answer2: "체크인 전과 체크아웃 후에 수하물 보관이 가능합니다."
    question3: "주차장이 있나요?"
    answer3: "전용 주차장은 없지만, 근처 유료 주차장을 이용할 수 있습니다."

  map:
    address: "〒111-0035 도쿄도 다이토구 니시아사쿠사 3-20-13"

  policies:
    title: "이용 정책"
    question1: "반려동물 동반이 가능한가요?"
    answer1: "반려동물은 허용되지 않습니다."
    question2: "흡연이 가능한가요?"
    answer2: "본 숙소는 전면 금연입니다."
    question3: "어린이 숙박이 가능한가요?"
    answer3: "어린이 숙박이 가능합니다."

  reservations:
    title: "예약 및 체크인"
    question1: "체크인 및 체크아웃 시간은 언제인가요?"
    answer1: "체크인은 15:00부터 가능하며, 체크아웃은 11:00까지입니다."
    question2: "얼리 체크인이나 얼리 체크아웃이 가능한가요?"
    answer2: "얼리 체크인은 객실 상황에 따라 가능할 수 있으며, 가능한 경우 도와드립니다. 얼리 체크아웃은 언제든 가능합니다."
    question3: "당일 방문 예약이 가능한가요?"
    answer3: "당일 객실 상황에 따라 워크인 예약이 가능합니다."
    question4: "취소 정책은 어떻게 되나요?"
    answer4: "예약 후 3시간 이내에는 무료 취소가 가능하며, 이후에는 취소 수수료가 발생합니다."
    question5: "어떤 결제 수단을 이용할 수 있나요?"
    answer5: "주요 신용카드, 현금 및 일부 디지털 결제 수단을 이용하실 수 있습니다."
    question6: "보증금이 필요한가요?"
    answer6: "보증금은 필요하지 않습니다."

  restaurants:
    title: "레스토랑 & 카페"
    place1: "와후도코로 우사기 (和風処うさぎ) – 도보 9분"
    info1: "제철 요리와 다양한 사케를 즐길 수 있는 편안한 분위기의 이자카야."
    place2: "카페 미치쿠사 (カフェみちくさ) – 도보 9분"
    info2: "런치 세트와 가벼운 식사를 제공하는 아늑한 카페로 브런치나 커피 타임에 적합합니다."
    place3: "스케마사 커피 (スケマサコーヒー) – 도보 10분"
    info3: "아사쿠사 뒷골목에 위치한 조용한 스페셜티 커피숍으로, 관광 후 커피나 디저트에 좋습니다."
    place4: "요로이야 (与ろゐ屋) – 도보 11분"
    info4: "아사쿠사 스타일의 간장 라멘으로 유명한 캐주얼하고 맛있는 라멘집."
    place5: "베니츠루 팬케이크 (紅鶴パンケーキ) – 도보 12분"
    info5: "푹신한 수플레 스타일 팬케이크로 유명하며, 아침이나 여유로운 간식에 좋습니다."
    place6: "스시잔마이 아사쿠사 가미나리몬점 (すしざんまい) – 도보 13분"
    info6: "합리적인 가격의 신선한 스시를 즐길 수 있어 관광객에게 인기가 많습니다."

  amenities:
    title: "객실 및 어메니티"
    question1: "어떤 어메니티가 포함되어 있나요?"
    answer1: >
      타월, 샴푸, 바디워시 등 욕실 어메니티가 제공됩니다.
      자세한 내용은 %{rooms_link}를 확인해 주세요.
    question2: "Wi-Fi를 이용할 수 있나요?"
    answer2: "네, 호텔 전 구역에서 무료 고속 Wi-Fi를 이용하실 수 있습니다."
    question3: "세면도구는 매일 보충되나요?"
    answer3: "네, 투숙 중 하우스키핑 서비스로 보충됩니다."

    links:
      rooms: "객실"

  shopping:
    title: "쇼핑 거리"
    place1: "갓파바시 주방용품 거리 (かっぱ橋道具街) – 도보 5분"
    info1: "주방용품, 일본 칼, 도자기, 음식 모형 상점으로 유명한 거리입니다."
    place2: "우라 아사쿠사 (裏浅草) – 도보 6분"
    info2: "부티크, 수공예품, 개성 있는 카페가 모여 있는 트렌디한 골목입니다."
    place3: "록쿠 브로드웨이 / 록쿠도리 (六区通り) – 도보 9분"
    info3: "극장과 노점이 있는 쇼와 시대 분위기의 레트로 쇼핑 거리입니다."
    place4: "덴포인 거리 (伝法院通り) – 도보 10분"
    info4: "전통 공예품과 화과자, 레트로 상점이 있는 에도풍 거리입니다."
    place5: "나카미세 상점가 (仲見世商店街) – 도보 12분"
    info5: "일본에서 가장 오래된 상점가 중 하나로 전통 간식과 기념품이 가득합니다."
    place6: "신 나카미세 상점가 (新仲見世商店街) – 도보 13분"
    info6: "의류, 액세서리, 간식, 캐주얼한 식당이 있는 아케이드 상점가입니다."
    place7: "홋피 거리 (ホッピー通り) – 도보 14분"
    info7: "이자카야와 포장마차가 늘어선 활기찬 골목으로, 밤 분위기가 특히 좋습니다."

  aboutus:
    info1: "전통과 문화, 그리고 현대적인 편안함이 어우러진 아사쿠사의 새로운 휴식처에 오신 것을 환영합니다."
    info2: "스타일과 편리함, 일본 특유의 매력을 소중히 여기는 여행자를 위해 디자인되었습니다."
    info3: "진정성 있고 활기찬, 오직 도쿄에서만 느낄 수 있는 아사쿠사를 경험해 보세요."

