  access:
    title: "交通及出行"
    description: "浅草在东京拥有卓越的交通便利性，从酒店出发轻松前往市内各大景点。多条地铁线路、机场连接以及观光船近在咫尺，让出行简单方便。"

    subway:
      - station: "浅草站（筑波快线 – TX线）– 步行3分钟"
        info: "最近的车站，方便前往秋叶原及东京北部"
      - station: "田原町站（银座线）– 步行7分钟"
        info: "快速前往上野、银座、新桥、赤坂、涩谷"
      - station: "浅草站（银座线）– 步行10分钟"
        info: "直达上野、银座和涩谷"

    airport:
      title: "机场出行"
      haneda: "羽田机场 → 浅草：约40~45分钟（都营浅草线，通常无需换乘）"
      narita: "成田机场 → 浅草：约60~70分钟（京成线 → 都营浅草线，部分直达）"

    bus:
      title: "公交及地面交通"
      info1: "附近都营巴士直达上野、东京晴空塔、东京站及日本桥"
      info2: "适合喜欢地面出行的客人"

    sightseeing:
      title: "观光选项"
      info1: "东京水上巴士（隅田川游船）– 步行10分钟"
      info2: "可前往台场、浜离宫及日出码头"
      info3: "浅草历史街区提供人力车游览"

    taxi:
      title: "出租车及共享出行"
      info1: "雷门及浅草站附近设有出租车乘车点"
      info2: "支持无现金叫车应用：GO、Uber、DiDi"

  location:
    link:
      map: "地图"
      access: "交通信息"
      form: "联系表单"
    title: "位置与交通"
    question1: "如何前往酒店？"
    answer1: >
      酒店位于浅草站和田原町站附近，可通过地铁和公交轻松抵达。
      请参考 %{map_link} 查看详细地址，
      并查看 %{access_link} 部分获取交通信息。
      如需进一步协助，请通过 %{contact_link} 与我们联系。
    question2: "是否提供机场接送服务？"
    answer2: "我们不提供机场接送服务，但可为您推荐最便捷的交通方式。"
    question3: "附近有停车场吗？"
    answer3: "酒店内不提供停车位，但步行范围内有多处付费停车场。"  

  arrivals:
    room: "房间"
    checkin: "入住"
    guests: "人数"    

  attractions:
    title: "本地景点"
    description: "我们的酒店位置方便，步行即可到达东京一些最具标志性的文化和历史景点。"
    attraction1: "浅草寺（Sensō-ji Temple）– 步行8分钟"
    info1: "东京最古老且最受欢迎的寺庙，著名的雷门和五重塔都在这里。"
    attraction2: "仲见世街 – 步行9分钟"
    info2: "通往浅草寺的历史步行街，售卖传统工艺品和经典日本街头小吃。"
    attraction3: "浅草神社（Asakusa Shrine）– 步行10分钟"
    info3: "位于浅草寺旁的保存完好的神社，以三社祭闻名。"
    attraction4: "浅草文化旅游信息中心 – 步行11分钟"
    info4: "提供免费观景台，可俯瞰浅草和东京天空树全景。"
    attraction5: "花屋敷游乐园 – 步行12分钟"
    info5: "日本最古老的游乐园，提供怀旧复古的游乐设施和适合家庭的景点。"
    attraction6: "隅田公园 – 步行13分钟"
    info6: "沿河公园，因樱花和天空树景观而闻名。"
    attraction7: "隅田川步道 – 步行15分钟"
    info7: "风景优美的步行桥，可欣赏河滨美景并通往东京天空树。"
    attraction8: "东京天空树 – 步行20分钟 / 乘火车10分钟"
    info8: "日本最高的塔，设有观景台、水族馆和购物中心。"  