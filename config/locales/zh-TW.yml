  access:
    title: "交通及出行"
    description: "淺草在東京擁有卓越的交通便利性，從飯店出發輕鬆前往市內各大景點。多條地鐵路線、機場連接以及觀光船近在咫尺，讓出行簡單方便。"

    subway:
      - station: "淺草站（筑波快線 – TX線）– 步行3分鐘"
        info: "最近的車站，方便前往秋葉原及東京北部"
      - station: "田原町站（銀座線）– 步行7分鐘"
        info: "快速前往上野、銀座、新橋、赤坂、澀谷"
      - station: "淺草站（銀座線）– 步行10分鐘"
        info: "直達上野、銀座和澀谷"

    airport:
      title: "機場出行"
      haneda: "羽田機場 → 淺草：約40~45分鐘（都營淺草線，通常無需換乘）"
      narita: "成田機場 → 淺草：約60~70分鐘（京成線 → 都營淺草線，部分直達）"

    bus:
      title: "公車及地面交通"
      info1: "附近都營巴士直達上野、東京晴空塔、東京站及日本橋"
      info2: "適合喜歡地面出行的客人"

    sightseeing:
      title: "觀光選項"
      info1: "東京水上巴士（隅田川遊船）– 步行10分鐘"
      info2: "可前往台場、濱離宮及日出碼頭"
      info3: "淺草歷史街區提供人力車遊覽"

    taxi:
      title: "計程車及共乘服務"
      info1: "雷門及淺草站附近設有計程車乘車點"
      info2: "支持無現金叫車應用：GO、Uber、DiDi"

  location:
    link:
      map: "地圖"
      access: "交通資訊"
      form: "聯絡表單"
    title: "位置與交通"
    question1: "如何前往飯店？"
    answer1: >
      飯店位於淺草站與田原町站附近，可輕鬆搭乘地鐵與公車抵達。
      請參考 %{map_link} 查看詳細地址，
      並查看 %{access_link} 章節了解交通方式。
      如需進一步協助，歡迎透過 %{contact_link} 與我們聯繫。
    question2: "是否提供機場接送服務？"
    answer2: "本飯店不提供機場接送服務，但可為您提供最佳交通建議。"
    question3: "附近有停車場嗎？"
    answer3: "飯店未設置停車場，但步行距離內有多個付費停車場。"  

  arrivals:
    room: "房間"
    checkin: "入住"
    guests: "人數"    

  attractions:
    title: "本地景點"
    description: "我們的酒店位置方便，步行即可到達東京一些最具標誌性的文化和歷史景點。"
    attraction1: "淺草寺（Sensō-ji Temple）– 步行8分鐘"
    info1: "東京最古老且最受歡迎的寺廟，著名的雷門和五重塔都在這裡。"
    attraction2: "仲見世街 – 步行9分鐘"
    info2: "通往淺草寺的歷史步行街，售賣傳統工藝品和經典日本街頭小吃。"
    attraction3: "淺草神社（Asakusa Shrine）– 步行10分鐘"
    info3: "位於淺草寺旁的保存完好的神社，以三社祭聞名。"
    attraction4: "淺草文化旅遊資訊中心 – 步行11分鐘"
    info4: "提供免費觀景台，可俯瞰淺草和東京天空樹全景。"
    attraction5: "花屋敷遊樂園 – 步行12分鐘"
    info5: "日本最古老的遊樂園，提供懷舊復古的遊樂設施和適合家庭的景點。"
    attraction6: "隅田公園 – 步行13分鐘"
    info6: "沿河公園，因櫻花和天空樹景觀而聞名。"
    attraction7: "隅田川步道 – 步行15分鐘"
    info7: "風景優美的步行橋，可欣賞河濱美景並通往東京天空樹。"
    attraction8: "東京天空樹 – 步行20分鐘 / 乘火車10分鐘"
    info8: "日本最高的塔，設有觀景台、水族館和購物中心。"  