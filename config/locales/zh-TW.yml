    guests: "人數"

  departure:
    room: "房間"
    checkin: "入住"
    guests: "人數"

  attractions:
    title: "本地景點"
    description: "我們的酒店位置方便，步行即可到達東京一些最具標誌性的文化和歷史景點。"
    attraction1: "淺草寺（Sensō-ji Temple）– 步行8分鐘"
    info1: "東京最古老且最受歡迎的寺廟，著名的雷門和五重塔都在這裡。"
    attraction2: "仲見世街 – 步行9分鐘"
    info2: "通往淺草寺的歷史步行街，售賣傳統工藝品和經典日本街頭小吃。"
    attraction3: "淺草神社（Asakusa Shrine）– 步行10分鐘"
    info3: "位於淺草寺旁的保存完好的神社，以三社祭聞名。"
    attraction4: "淺草文化旅遊資訊中心 – 步行11分鐘"
    info4: "提供免費觀景台，可俯瞰淺草和東京天空樹全景。"
    attraction5: "花屋敷遊樂園 – 步行12分鐘"
    info5: "日本最古老的遊樂園，提供懷舊復古的遊樂設施和適合家庭的景點。"
    attraction6: "隅田公園 – 步行13分鐘"
    info6: "沿河公園，因櫻花和天空樹景觀而聞名。"
    attraction7: "隅田川步道 – 步行15分鐘"
    info7: "風景優美的步行橋，可欣賞河濱美景並通往東京天空樹。"
    attraction8: "東京天空樹 – 步行20分鐘 / 乘火車10分鐘"
    info8: "日本最高的塔，設有觀景台、水族館和購物中心。"

  culture:
    title: "文化體驗"
    culture1: "現代及復古和服/浴衣租賃（可選髮型造型）；非常適合遊覽淺草寺。"
    info1: "東京最古老且最受歡迎的寺廟，著名的雷門和五重塔都在這裡。"
    culture2: "Kesa 東京和服租賃 – 步行10分鐘"
    info2: "提供休閒及正式和服，可使用英文。適合在淺草神社街區漫步。"
    culture3: "茶道體驗 – 步行10分鐘"
    info3: "在榻榻米房間學習茶道禮儀，準備抹茶，享受日本點心。"
    culture4: "和菓子製作體驗 – 步行10分鐘"
    info4: "在傳統甜點師指導下製作應季的練切點心。"
    culture5: "摺紙 / 書法工作坊 – 步行10分鐘"
    info5: "親手體驗日本書法或傳統紙藝製作。"
    culture6: "和服 + 江戶切子玻璃工藝體驗 (花華 × 創吉) – 步行12分鐘"
    info6: "穿上和服製作江戶風格切割玻璃，獨特的工藝與文化體驗結合。"
    culture7: "相撲博物館 & 兩國國技館 – 乘火車20分鐘"
    info7: "相撲文化中心；探索博物館、體育場及兩國的相撲主題街道。"
    culture8: "相撲早晨練習參觀 – 乘火車20分鐘"
    info8: "早晨參觀相撲訓練館，深入了解真實相撲生活。"

  facilities:
    title: "設施"
    question1: "有洗衣間嗎？"
    answer1: "是的，每間公寓都配有洗衣機和烘乾機。"
    question2: "可以寄放行李嗎？"
    answer2: "入住前和退房後都可以寄放行李。"
    question3: "有停車場嗎？"
    answer3: "沒有私人停車位，但附近有付費停車場可使用。"

  map:
    address: "〒111-0035 東京都台東區西淺草3-20-13"

  policies:
    title: "住宿政策"
    question1: "可以攜帶寵物嗎？"
    answer1: "不允許攜帶寵物。"
    question2: "可以吸菸嗎？"
    answer2: "本館為全館禁菸。"
    question3: "可以攜帶兒童入住嗎？"
    answer3: "歡迎兒童入住。"

  reservations:
    title: "訂房與入住"
    question1: "入住與退房時間是幾點？"
    answer1: "入住時間為15:00 之後，退房時間為 11:00 之前。"
    question2: "可以申請提前入住或提前退房嗎？"
    answer2: "提前入住需視房況而定，若可行我們將盡量安排；提前退房則隨時可以。"
    question3: "可以當天直接到店訂房嗎？"
    answer3: "是否接受當天到店訂房取決於當日房間狀況。"
    question4: "取消政策為何？"
    answer4: "訂房後 3 小時內可免費取消，超過時間將收取取消費用。"
    question5: "可使用哪些付款方式？"
    answer5: "我們接受主要信用卡、現金以及部分數位支付方式。"
    question6: "需要支付押金嗎？"
    answer6: "不需要押金。"

  restaurants:
    title: "餐廳與咖啡館"
    place1: "和風處兔（和風処うさぎ）– 步行9分鐘"
    info1: "氣氛輕鬆的居酒屋，提供當季料理與多樣清酒選擇。"
    place2: "道草咖啡（カフェみちくさ）– 步行9分鐘"
    info2: "溫馨咖啡館，提供午餐套餐與輕食，適合早午餐或輕鬆休息。"
    place3: "Sukemasa Coffee（スケマサコーヒー）– 步行10分鐘"
    info3: "位於淺草後街的安靜精品咖啡店，適合觀光後享用手沖咖啡或甜點。"
    place4: "Yoroiya（与ろゐ屋）– 步行11分鐘"
    info4: "經典淺草風味醬油拉麵，輕鬆又美味。"
    place5: "Benitsuru Pancake（紅鶴鬆餅）– 步行12分鐘"
    info5: "以蓬鬆的舒芙蕾風鬆餅聞名，適合早餐或悠閒的甜點時光。"
    place6: "壽司三味 淺草雷門店（すしざんまい）– 步行13分鐘"
    info6: "價格實惠、品質穩定的壽司店，適合想在淺草享用新鮮壽司的旅客。"

  amenities:
    title: "客房與設施"
    question1: "包含哪些設施？"
    answer1: >
      我們提供毛巾、洗髮精、沐浴乳等盥洗用品。
      詳情請查看%{rooms_link}。
    question2: "有提供 Wi-Fi 嗎？"
    answer2: "是的，飯店全館提供免費高速 Wi-Fi。"
    question3: "盥洗用品會每天補充嗎？"
    answer3: "是的，住宿期間將由房務人員補充。"

    links:
      rooms: "客房"

  shopping:
    title: "購物街區"
    place1: "合羽橋道具街（かっぱ橋道具街）– 步行5分鐘"
    info1: "以廚具、日本刀具、陶瓷及食品模型商店聞名的街道。"
    place2: "裏淺草（裏浅草）– 步行6分鐘"
    info2: "充滿精品店、手工藝品與獨立咖啡館的時尚後街。"
    place3: "六區大道／六區通（六区通り）– 步行9分鐘"
    info3: "具有昭和復古風格的商店街，結合劇場、小吃攤與老東京魅力。"
    place4: "傳法院通（伝法院通り）– 步行10分鐘"
    info4: "江戶風格街道，販售傳統工藝、和菓子甜點與復古商店。"
    place5: "仲見世商店街（仲見世商店街）– 步行12分鐘"
    info5: "日本最古老的商店街之一，提供傳統小吃、紀念品與手工藝品。"
    place6: "新仲見世商店街（新仲見世商店街）– 步行13分鐘"
    info6: "有遮棚的商店街，販售服飾、配件、零食與輕食餐廳。"
    place7: "Hoppy通（ホッピー通り）– 步行14分鐘"
    info7: "聚集居酒屋與小吃攤的熱鬧街道，夜晚氣氛特別好。"

  aboutus:
    info1: "歡迎來到淺草全新的靜謐居所——傳統、文化與現代舒適在此完美結合。"
    info2: "專為重視風格、便利性與日式魅力的旅人所設計。"
    info3: "與我們一同體驗真實、充滿活力且獨一無二的東京淺草。"

