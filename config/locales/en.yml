    guests: "Guests"

  attractions:
    title: "Local Attractions"
    description: "Our location offers quick access to some of Tokyo’s most iconic cultural and historic landmarks—all within walking distance."
    attraction1: "Sensō-ji Temple (浅草寺) – 8 min walk"
    info1: "Tokyo’s oldest and most visited temple, home to the famous Kaminarimon Gate and Five-Story Pagoda."
    attraction2: "Nakamise Shopping Street – 9 min walk"
    info2: "A historic promenade leading to Sensō-ji filled with traditional crafts and classic Japanese street snacks."
    attraction3: "Asakusa Shrine (浅草神社) – 10 min walk"
    info3: "A beautifully preserved Shinto shrine next to Sensō-ji, known for the Sanja Matsuri festival."
    attraction4: "Asakusa Culture Tourist Information Center – 11 min walk"
    info4: "Offers a free observation deck with panoramic views of Asakusa and Tokyo Skytree."
    attraction5: "Hanayashiki Amusement Park – 12 min walk"
    info5: "Japan’s oldest amusement park, offering nostalgic retro rides and family-friendly attractions."
    attraction6: "Sumida Park – 13 min walk"
    info6: "A riverside park famous for cherry blossoms and Skytree views along the water."
    attraction7: "Sumida River Walk – 15 min walk"
    info7: "A scenic pedestrian bridge offering beautiful waterfront views and access to Tokyo Skytree."
    attraction8: "Tokyo Skytree – 20 min walk / 10 min by train."
    info8: "The tallest tower in Japan with observation decks, aquarium, and shopping center."

  culture:
    title: "Cultural Experiences"
    culture1: "Modern and vintage kimono/yukata rentals with optional hairstyling; perfect for exploring Sensō-ji."
    info1: "Tokyo’s oldest and most visited temple, home to the famous Kaminarimon Gate and Five-Story Pagoda."
    culture2: "Kesa Tokyo Kimono Rental (ケサ東京) – 10 min walk"
    info2: "Casual and formal kimono options with English support; great for strolling through Asakusa’s shrines."
    culture3: "Tea Ceremony Experience (茶道体験) – 10 min walk."
    info3: "Learn traditional tea ceremony etiquette, prepare matcha, and enjoy Japanese sweets in a tatami room."
    culture4: "Wagashi Sweets Making (和菓子作り体験) – 10 min walk."
    info4: "Create seasonal nerikiri sweets with guidance from a traditional confectionery teacher."
    culture5: "Origami / Calligraphy Workshop (折り紙・書道体験) – 10 min walk."
    info5: "Hands-on experience learning Japanese calligraphy or crafting traditional paper art."
    culture6: "Kimono + Edo Kiriko Glass Cutting Workshop (花華 × 創吉) – 12 min walk."
    info6: "Wear a kimono and make your own Edo-style cut glass — a unique craft and culture combination experience."
    culture7: "Sumo Museum & Ryogoku Kokugikan (相撲博物館・両国国技館) – 20 min by train."
    info7: "The center of sumo culture; explore the museum, the stadium, and sumo-themed streets in Ryōgoku."
    culture8: "Sumo Morning Practice Viewing (相撲部屋 朝稽古) – 20 min by train."
    info8: "Visit a sumo stable during early morning training for an unforgettable look at real sumo life."

  facilities:
    title: "Facilities"
    question1: "Do you have a laundry area?"
    answer1: "Yes, every apartment has a washer-dryer."
    question2: "Is luggage storage available?"
    answer2: "Luggage storage is available before check-in and after check-out."
    question3: "Do you have parking?"
    answer3: "We do not have private parking, but nearby paid parking options are available."

  map:
    address: "〒111-0035 Tokyo, Taito-ku, Nishiasakusa 3-20-13"

  policies:
    title: "Policies"
    question1: "Are pets allowed?"
    answer1: "Pets are not allowed."
    question2: "Is smoking permitted?"
    answer2: "The hotel is fully non-smoking."
    question3: "Do you allow children?"
    answer3: "Children are welcome."

  reservations:
    title: "Reservation & Check in"
    question1: "What are the check-in and check-out times?"
    answer1: "Check-in starts from 15:00 & Check-out is until 11:00."
    question2: "Can I request early check-in or early check-out?"
    answer2: "Early check-in depends on availability, if possible we will accomodate it for you, while early check-out is always available."
    question3: "Do you accept walk-in reservations?"
    answer3: "Walk-ins are accepted depending on room availability on the same day."
    question4: "What is your cancellation policy?"
    answer4: "Free cancellation is available within 3 hours of booking, after that, cancellation fees will apply."
    question5: "What payment methods do you accept?"
    answer5: "We accept major credit cards, cash, and selected digital payment methods."
    question6: "Is there a deposit required?"
    answer6: "Deposit is not required."

  restaurants:
    title: "Restaurants & Cafes"
    place1: "Wafuu-dokoro Usagi (和風処うさぎ) – 9 min walk."
    info1: "Relaxed izakaya with seasonal dishes and a great selection of sake."
    place2: "Cafe Michikusa (カフェみちくさ) – 9 min walk."
    info2: "Cozy café offering lunch sets and light meals; ideal for brunch or a casual coffee break."
    place3: "Sukemasa Coffee (スケマサコーヒー) – 10 min walk."
    info3: "Quiet specialty coffee shop near Asakusa’s backstreets — perfect for a relaxed filter coffee or dessert after sightseeing."
    place4: "Yoroiya (与ろゐ屋) – 11 min walk."
    info4: "Classic Asakusa-style soy-sauce ramen, casual and delicious."
    place5: "Benitsuru Pancake (紅鶴パンケーキ) – 12 min walk."
    info5: "Famous for fluffy, soufflé-style pancakes — great for breakfast or a relaxed treat."
    place6: "Sushi Zanmai Asakusa Kaminarimon (すしざんまい 浅草雷門店) – 13 min walk."
    info6: "Affordable, reliable sushi — ideal for visitors wanting fresh sushi near Asakusa."

  amenities:
    title: "Rooms & Amenities"
    question1: "What amenities are included?"
    answer1: >
      Bathroom amenities including towels, shampoo, body wash, and more are provided.
      For details, feel free to check our %{rooms_link}.
    question2: "Is Wi-Fi available?"
    answer2: "Yes, free high-speed Wi-Fi is available throughout the hotel."
    question3: "Are toiletries replenished daily?"
    answer3: "Yes, housekeeping will replenish them during your stay."

    links:
      rooms: "rooms"

  shopping:
    title: "Shopping Streets"
    place1: "Kappabashi Kitchen Town (かっぱ橋道具街) – 5 min walk."
    info1: "Famous street for kitchenware, Japanese knives, ceramics, and food-sample shops."
    place2: "Ura-Asakusa (裏浅草) – 6 min walk."
    info2: "Trendy backstreets with boutiques, handcrafted goods, and indie cafés."
    place3: "Rokku Broadway / Rokku-dori (六区通り) – 9 min walk."
    info3: "Retro Showa-style shopping street with theaters, snack stalls, and old-Tokyo charm."
    place4: "Denpoin Street (伝法院通り) – 10 min walk."
    info4: "Edo-style street with traditional crafts, wagashi sweets, and retro shops."
    place5: "Nakamise Shopping Street (仲見世商店街) – 12 min walk."
    info5: "One of Japan’s oldest shopping streets with traditional snacks, souvenirs, and local crafts."
    place6: "Shin-Nakamise Street (新仲見世商店街) – 13 min walk."
    info6: "Covered shopping arcade with clothing, accessories, snacks, and casual eateries."
    place7: "Hoppy Street (ホッピー通り) – 14 min walk."
    info7: "Lively alley with izakayas and food stalls — best for nighttime atmosphere."

  aboutus:
    info1: "Welcome to Asakusa’s newest hideaway—where tradition, culture, and modern comfort come together."
    info2: "Designed for travelers who appreciate style, convenience, and a touch of Japanese charm."
    info3: "Experience Asakusa with us—authentic, vibrant, and uniquely Tokyo."

